version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: 'dev'
    schedule:
      interval: weekly
    # Packages that must (react) or should (the rest) move together, so a bump
    # never leaves one half of a pair on the old version.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      commitlint:
        patterns: ['@commitlint/*']
      supabase:
        patterns: ['@supabase/*']
      eslint:
        patterns: ['eslint', 'typescript-eslint']
      prettier:
        patterns: ['prettier', 'prettier-plugin-*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: 'dev'
    schedule:
      interval: weekly
