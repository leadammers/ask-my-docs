version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: 'dev'
    schedule:
      interval: weekly
    # Group available updates for related packages. Dependabot does not force
    # packages without an available update to change.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      commitlint:
        patterns: ['@commitlint/*']
      supabase:
        patterns: ['@supabase/*']
      eslint:
        patterns: ['eslint', 'typescript-eslint']
      prettier:
        patterns: ['prettier', 'prettier-plugin-*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: 'dev'
    schedule:
      interval: weekly
