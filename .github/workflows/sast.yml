name: SAST

on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.155.0
    steps:
      - uses: actions/checkout@v5

      - run: semgrep scan --config p/security-audit --config p/javascript --config p/typescript
